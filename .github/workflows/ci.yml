name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TESTS: ${{ startsWith(github.ref, 'refs/tags/v') && 'extended or not extended' || 'not extended' }}
  UV_VERSION: "0.13.8"
  UV_PYTHON_PREFERENCE: only-managed

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest # uv-x86_64-unknown-linux-gnu.tar.gz
            uv-sha256: 5acfd9177cfecf0bf87578f059728215ccc884388988f55f7a65041b57387d91
          - os: macos-latest # uv-aarch64-apple-darwin.tar.gz
            uv-sha256: 6b71028a6b904f2ae3340ef52e595512de807d06c0a20eaef2f692581b246558
          - os: macos-15-intel # uv-x86_64-apple-darwin.tar.gz
            uv-sha256: a04c2ffeac28b2003a2c13caf538ab425fcd7def3e4a41571f4a8fb370a66af3
          - os: windows-latest # uv-x86_64-pc-windows-msvc.zip
            uv-sha256: 529e78a9cec6cd7e3e014f7ecd8bda0c113969d4ed0f2efeedb85c30943325b8
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: ${{ env.UV_VERSION }}
          checksum: ${{ matrix.uv-sha256 }}
          # Test entire setup when building a release
          enable-cache: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Synchronize project dependencies
        run: uv sync --frozen

      - name: Run the test suite
        shell: bash
        run: uv run pytest -q --tb=short --no-header -m "$TESTS"

      - name: Build the wheel
        run: uv build --wheel --out-dir dist

      - name: Install the wheel, and create every role's workspace with it
        shell: bash
        run: uv run --frozen --no-dev python -m tests.wheel_check dist/pprl-*.whl

      - name: Keep the wheel for the release
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel
          path: dist/*.whl
          if-no-files-found: error

  # On a version tag, check the locked packages for known vulnerabilities
  audit:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: ${{ env.UV_VERSION }}
          checksum: 5acfd9177cfecf0bf87578f059728215ccc884388988f55f7a65041b57387d91
          enable-cache: false

      - name: Audit for known vulnerabilities
        run: uv audit --preview-features audit-command

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [test, audit]
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Get the wheel
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wheel
          path: dist

      - name: Check that the tag names the wheel's version, a release version
        run: |
          WHEEL=$(ls dist/pprl-*.whl)
          VERSION=$(basename "$WHEEL" | cut -d- -f2)
          echo "Wheel: $WHEEL, tag: $TAG"
          test "$TAG" = "v$VERSION"
          case "$VERSION" in *dev*) echo "$VERSION is a development version"; exit 1;; esac
          if echo "$VERSION" | grep -Eq '[0-9](a|b|rc)[0-9]'; then
            echo "PRE=--prerelease" >> "$GITHUB_ENV"
          else
            echo "PRE=" >> "$GITHUB_ENV"
          fi

      - name: Attest the wheel's build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*.whl

      - name: Check that the tag has no published release
        run: |
          if DRAFT=$(gh release view "$TAG" --json isDraft --jq .isDraft 2> /dev/null); then
            if [ "$DRAFT" != true ]; then
              echo "$TAG is already published, and a published release can't be changed"
              exit 1
            fi
            echo "Deleting the draft left by an earlier run"
            gh release delete "$TAG" --yes
          fi

      - name: Create a draft release with the wheel
        run: |
          # $PRE is empty or one option, so it is left unquoted
          # shellcheck disable=SC2086
          gh release create "$TAG" --draft --verify-tag --title "pprl $TAG" \
            --generate-notes $PRE dist/pprl-*.whl

      - name: Add the wheel's SHA-256 to the release notes
        run: |
          gh release view "$TAG" --json body --jq .body > notes.md
          {
            echo
            for WHEEL in dist/pprl-*.whl; do
              echo "SHA-256 of $(basename "$WHEEL"): \`$(sha256sum "$WHEEL" | cut -d' ' -f1)\`"
            done
          } >> notes.md
          gh release edit "$TAG" --notes-file notes.md

      - name: Publish the release
        run: |
          if [ -n "$PRE" ]; then
            gh release edit "$TAG" --draft=false --latest=false
          else
            gh release edit "$TAG" --draft=false
          fi
